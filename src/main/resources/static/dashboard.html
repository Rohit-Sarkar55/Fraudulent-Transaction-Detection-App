<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fraud Detection — Live Dashboard</title>
<style>
  :root {
    --bg: #0b0d12;
    --surface: #151822;
    --surface-2: #1c202c;
    --border: #2a2f3d;
    --text-primary: #e8eaf0;
    --text-secondary: #9aa1b3;
    --danger: #e24b4a;
    --danger-bg: #3a1f1f;
    --warning: #eda100;
    --warning-bg: #3a2f14;
    --success: #63c522;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    font-size: 20px;
    font-weight: 500;
    margin: 0 0 1.5rem;
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }
  .metric-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 4px;
  }
  .metric-value {
    font-size: 24px;
    font-weight: 500;
    margin: 0;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 1rem;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-secondary);
  }
  .status-dot.connected { background: var(--success); }
  .alert-feed {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .alert-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--danger);
    border-radius: 8px;
    padding: 14px 16px;
    animation: slide-in 0.3s ease-out;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .alert-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .alert-title {
    font-size: 14px;
    font-weight: 500;
  }
  .alert-score {
    font-size: 13px;
    color: var(--danger);
    background: var(--danger-bg);
    padding: 2px 8px;
    border-radius: 4px;
  }
  .alert-meta {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .alert-explanation {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-primary);
  }
  .empty-state {
    text-align: center;
    color: var(--text-secondary);
    padding: 3rem 0;
    font-size: 14px;
  }
</style>
</head>
<body>

<h1>Real-time fraud detection — live alert feed</h1>
<div class="status">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText">Connecting...</span>
</div>

<div class="metrics">
  <div class="metric-card">
    <p class="metric-label">Alerts received</p>
    <p class="metric-value" id="alertCount">0</p>
  </div>
  <div class="metric-card">
    <p class="metric-label">Avg risk score</p>
    <p class="metric-value" id="avgScore">--</p>
  </div>
  <div class="metric-card">
    <p class="metric-label">Highest score</p>
    <p class="metric-value" id="maxScore">--</p>
  </div>
  <div class="metric-card">
    <p class="metric-label">Last alert</p>
    <p class="metric-value" id="lastAlertTime" style="font-size: 16px;">--</p>
  </div>
</div>

<div class="alert-feed" id="alertFeed">
  <div class="empty-state" id="emptyState">Waiting for fraud alerts... try triggering one with:<br>
    <code>curl -X POST http://localhost:8080/api/demo/inject/velocity</code>
  </div>
</div>

<script>
  const feed = document.getElementById('alertFeed');
  const emptyState = document.getElementById('emptyState');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const alertCountEl = document.getElementById('alertCount');
  const avgScoreEl = document.getElementById('avgScore');
  const maxScoreEl = document.getElementById('maxScore');
  const lastAlertTimeEl = document.getElementById('lastAlertTime');

  let alertCount = 0;
  let scoreSum = 0;
  let maxScore = 0;

  const source = new EventSource('/api/dashboard/stream');

  source.onopen = () => {
    statusDot.classList.add('connected');
    statusText.textContent = 'Connected — waiting for alerts';
  };

  source.onerror = () => {
    statusDot.classList.remove('connected');
    statusText.textContent = 'Disconnected — retrying...';
  };

  source.addEventListener('fraud-alert', (event) => {
    const alert = JSON.parse(event.data);
    if (emptyState) emptyState.remove();

    alertCount++;
    scoreSum += alert.riskScore;
    maxScore = Math.max(maxScore, alert.riskScore);

    alertCountEl.textContent = alertCount;
    avgScoreEl.textContent = Math.round(scoreSum / alertCount);
    maxScoreEl.textContent = maxScore;
    lastAlertTimeEl.textContent = new Date().toLocaleTimeString();

    const card = document.createElement('div');
    card.className = 'alert-card';
    card.innerHTML = `
      <div class="alert-header">
        <span class="alert-title">Card •${escapeHtml(alert.cardId)} — ${escapeHtml(alert.reasonCode)}</span>
        <span class="alert-score">Risk ${alert.riskScore}</span>
      </div>
      <div class="alert-meta">
        $${alert.amount.toFixed(2)} at ${escapeHtml(alert.merchant)} · ${escapeHtml(alert.customerId)}
      </div>
      <div class="alert-explanation">${escapeHtml(alert.aiExplanation || '')}</div>
    `;
    feed.prepend(card);

    // Keep the feed from growing unbounded during a long demo.
    while (feed.children.length > 50) {
      feed.removeChild(feed.lastChild);
    }
  });

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
