spring.application.name=fraud-detection-app

# Confluent Cloud bootstrap server
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}

# Confluent Cloud requires SASL_SSL auth on every client
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_API_KEY}" password="${KAFKA_API_SECRET}";

# Schema Registry connection (separate credentials from the Kafka cluster itself)
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL}
spring.kafka.properties.basic.auth.credentials.source=USER_INFO
spring.kafka.properties.schema.registry.basic.auth.user.info=${SCHEMA_REGISTRY_API_KEY}:${SCHEMA_REGISTRY_API_SECRET}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer

# Consumer
spring.kafka.consumer.group-id=fraud-detection-app
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.consumer.properties.specific.avro.reader=true

server.port=8080

# App-specific topic names — kept here instead of hardcoded in Java
# so they're easy to change without touching code.
app.kafka.topics.transactions=transactions
app.kafka.topics.customer-profiles=customer_profiles
app.kafka.topics.scored-transactions=scored_transactions
app.kafka.topics.fraud-alerts=fraud_alerts

# % of synthetic transactions the producer deliberately makes suspicious
app.fraud.injection-rate=0.02