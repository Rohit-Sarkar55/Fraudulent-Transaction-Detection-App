spring.application.name=fraud-detection-app-test
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.properties.security.protocol=PLAINTEXT
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=
spring.kafka.properties.schema.registry.url=http://localhost:8081
spring.kafka.properties.basic.auth.credentials.source=USER_INFO
spring.kafka.properties.schema.registry.basic.auth.user.info=key:secret
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=fraud-detection-test
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
app.kafka.topics.transactions=transactions
app.kafka.topics.customer-profiles=customer_profiles
app.kafka.topics.scored-transactions=scored_transactions
app.kafka.topics.fraud-alerts=fraud_alerts
app.kafka.topics.fraud-alerts-explained=fraud_alerts_explained
app.fraud.injection-rate=0.02
